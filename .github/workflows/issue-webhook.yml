name: Issue Webhook

on:
  issues:
    types: [opened]

jobs:
  notify-api:
    runs-on: ubuntu-latest
    steps:
      - name: Send issue to API
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          VVM_ORG_ID: ${{ secrets.VVM_ORGANIZATION_ID }}
        run: |
          payload=$(jq -n \
            --arg title "$ISSUE_TITLE" \
            --arg body "$ISSUE_BODY" \
            '{title: $title, body: $body}')
          
          response=$(curl -s -w "\n%{http_code}" --max-time 30 -X POST https://api.vvm.sr/project/issue \
            -H "Content-Type: application/json" \
            -H "x-vvm-organization: $VVM_ORG_ID" \
            -H "x-vvm-environment: prod" \
            -H "x-vvm-version: latest" \
            -d "$payload")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status Code: $http_code"
          echo "Response Body: $body"
          
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Error: API request failed with status code $http_code"
            exit 1
          fi
          
          echo "Issue successfully sent to API"
